/* ============ ابزارهای HTML امن (زیرمجموعه‌ی HTML تلگرام) ============ */
function safeHtml(src){
  const ALLOW={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,DEL:1,CODE:1,PRE:1,BLOCKQUOTE:1,A:1,BR:1};
  const doc=new DOMParser().parseFromString("<body>"+String(src||"").replace(/\n/g,"<br>")+"</body>","text/html");
  const walk=n=>{let out="";n.childNodes.forEach(c=>{if(c.nodeType===3)out+=esc(c.nodeValue);else if(c.nodeType===1){const t=c.tagName,inner=walk(c);if(!ALLOW[t])out+=inner;else if(t==="BR")out+="<br>";else if(t==="A"){const h=c.getAttribute("href")||"";out+=/^(https?:\/\/|tg:\/\/)/i.test(h)?`<a href="${esc(h)}" data-ext="1">${inner}</a>`:inner}else out+=`<${t.toLowerCase()}>${inner}</${t.toLowerCase()}>`}});return out};
  return walk(doc.body);
}

/* ============ مصرف و وضعیت سرویس ============ */
function svcState(d){
  if(!d||!d.usage)return{k:"mut",label:d&&d.usageErr?"نامشخص":"…",pct:0,left:null,days:null,unlimited:false,c1:"var(--a1)",c2:"var(--a2)"};
  const u=d.usage,now=Date.now(),exp=u.expire?u.expire*1000:0,total=Number(u.total)||0,left=total?Math.max(0,total-(Number(u.used)||0)):null,pct=total?left/total:0.04,days=exp?Math.ceil((exp-now)/864e5):null;
  let k="ok",label="فعال";
  if(u.status&&!["active","on_hold",""].includes(u.status)){k="bad";label=u.status==="expired"?"منقضی":u.status==="limited"?"حجم تمام":"غیرفعال"}
  else if((exp&&exp<now)){k="bad";label="منقضی"}
  else if(total&&left<=0){k="bad";label="حجم تمام"}
  else if((total&&pct<.15)||(days!==null&&days<=3)){k="warn";label="رو به اتمام"}
  const col={ok:["var(--a1)","var(--a2)"],warn:["#f59e0b","#fcd34d"],bad:["#f43f5e","#fb7185"],mut:["var(--a1)","var(--a2)"]}[k];
  return{k,label,pct:k==="bad"&&!total?0:pct,left,days,unlimited:!total,c1:col[0],c2:col[1],total,used:u.used,exp};
}
let ringId=0;
function ring(pct,c1,c2,center){
  const id="rg"+(++ringId),r=42,C=2*Math.PI*r;
  return `<svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><circle class="trk" cx="50" cy="50" r="${r}"/><circle class="prg" cx="50" cy="50" r="${r}" stroke="url(#${id})" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-c="${C}" data-pct="${Math.max(0.02,Math.min(1,pct))}"/></svg>${center||""}`;
}
function animateRings(root=document){requestAnimationFrame(()=>requestAnimationFrame(()=>{$$(".prg[data-pct]",root).forEach(c=>{c.style.strokeDashoffset=(+c.dataset.c)*(1-(+c.dataset.pct))});$$(".bar>i[data-w]",root).forEach(b=>{b.style.width=b.dataset.w+"%"})}))}
const key=s=>s.kind+":"+s.id;

function svcCard(sv,i=0,compact=false){
  const d=S.usage[key(sv)],st=svcState(d),loading=sv.live&&!d;
  let body;
  if(!sv.live)body=`<div class="body"><div class="ringbox" style="display:grid;place-items:center;color:var(--a2)">${ic("link","")}</div><div class="facts" style="grid-template-columns:1fr"><div class="fact"><small>نوع سرویس</small><b>کانفیگ دستی</b></div><div class="fact"><small>مشاهده‌ی لینک</small><b>ضربه بزن ←</b></div></div></div>`;
  else if(loading)body=`<div class="body"><div class="ringbox"><div class="skl" style="width:86px;height:86px;border-radius:50%"></div></div><div class="facts"><div class="skl" style="height:46px"></div><div class="skl" style="height:46px"></div><div class="skl" style="height:46px"></div><div class="skl" style="height:46px"></div></div></div>`;
  else if(!d.usage)body=`<div class="body"><div class="ringbox" style="display:grid;place-items:center;color:var(--warn)">${ic("clock")}</div><div class="facts" style="grid-template-columns:1fr"><div class="fact"><small>وضعیت</small><b>اطلاعات مصرف در دسترس نیست</b></div></div></div>`;
  else body=`<div class="body"><div class="ringbox">${ring(st.pct,st.c1,st.c2,`<div class="c"><b class="num">${st.unlimited?"∞":fa(Math.round(st.pct*100))+"٪"}</b><small>${st.unlimited?"نامحدود":"باقی‌مانده"}</small></div>`)}</div>
    <div class="facts"><div class="fact"><small>حجم باقی</small><b class="num">${st.unlimited?"نامحدود":fmtGB(st.left)+" گیگ"}</b></div><div class="fact hc"><small>مصرف‌شده</small><b class="num">${fmtGB(st.used)} گیگ</b></div><div class="fact" style="grid-column:1/-1"><small>زمان باقی‌مانده</small><b class="num">${st.days===null?"نامحدود":st.days<=0?"تمام شده":fa(st.days)+" روز"}</b></div></div></div>`;
  return `<div class="card svc ${compact?"compact":""}" data-act="svc" data-k="${key(sv)}" style="--i:${i};--c1:${st.c1};--c2:${st.c2}"><div class="hd"><div class="t"><b>${esc(sv.title)}</b><small>${esc(sv.product||"")}</small></div><span class="pillst st-${st.k}">${esc(sv.live?(loading?"…":st.label):"فعال")}</span></div>${body}</div>`;
}

async function openTopup(preset=0){openSheet(`<div class="sheethead"><h3>شارژ کیف پول</h3><p>مبلغ دلخواه به تومان</p></div><input id="topupamount" type="number" min="10000" max="50000000" step="1000" value="${preset||""}" placeholder="مثلاً ۱۰۰۰۰۰" style="width:100%;padding:15px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:14px 0"><div class="presets">${[50000,100000,200000,500000].map(x=>`<button class="preset" data-amount="${x}">${fa(x)}<small>تومان</small></button>`).join("")}</div><button class="btn pri block" id="createtopup" style="margin-top:14px">ادامه</button>`);$$("[data-amount]",$("#sheet")).forEach(b=>b.onclick=()=>$("#topupamount").value=b.dataset.amount);$("#createtopup")?.addEventListener("click",async()=>{const b=$("#createtopup"),amount=Number($("#topupamount").value);if(!Number.isSafeInteger(amount)||amount<10000)return toast("حداقل شارژ ۱۰ هزار تومان است");b.disabled=true;try{const r=await api("/topup",{method:"POST",body:JSON.stringify({amount})});receiptPicker(r.order_id,r.amount,r.card_number,r.card_holder)}catch(e){b.disabled=false;toast(e.message)}})}

async function openRenew(k){
  const [kind,id]=k.split(":");openSheet(`<h3>انتخاب پلن تمدید</h3><div class="skl" style="height:100px;margin:14px 0"></div>`);
  try{const r=await api(`/renew-options?kind=${kind}&id=${id}`);if(!r.items.length){openSheet(`<h3>پلن تمدید موجود نیست</h3><p class="muted">برای این پنل محصول سازگار ثبت نشده است.</p>`);return}
    openSheet(`<h3>تمدید ${esc(r.username)}</h3><p class="muted">پلن موردنظر را انتخاب کن.</p><div class="stagger" style="margin-top:12px">${r.items.map(x=>x.custom?`<div class="card pad" style="margin-bottom:9px"><b>${esc(x.name)}</b><div class="muted">حجم <input id="rg${x.id}" type="number" min="${x.min_gb}" max="${x.max_gb}" value="${x.min_gb}" style="width:76px;background:var(--card);color:var(--tx)"> گیگ · مدت <input id="rd${x.id}" type="number" min="${x.min_days}" max="${x.max_days}" value="${x.min_days}" style="width:76px;background:var(--card);color:var(--tx)"> روز</div><button class="btn pri block" data-rp="${x.id}" style="margin-top:8px">انتخاب</button></div>`:`<button class="card pad block" data-rp="${x.id}" style="text-align:right;margin-bottom:9px;width:100%"><b>${esc(x.name)}</b><div class="muted">${x.gb?fa(x.gb)+" گیگ":"نامحدود"} · ${fa(x.days)} روز</div><b class="num">${fa(x.price)} تومان</b></button>`).join("")}</div>`);
    $$("[data-rp]",$("#sheet")).forEach(b=>b.onclick=()=>{const x=r.items.find(y=>y.id===Number(b.dataset.rp));if(x.custom){x.gb=Number($("#rg"+x.id).value);x.days=Number($("#rd"+x.id).value);if(x.gb<x.min_gb||x.gb>x.max_gb||x.days<x.min_days||x.days>x.max_days)return toast("حجم یا مدت خارج از محدوده است");x.price=Math.round(x.gb*x.price_per_gb+x.days*x.price_per_day)}confirmRenew(kind,id,x.id,x)});
  }catch(e){openSheet(`<h3>خطا در دریافت پلن‌ها</h3><p class="muted">${esc(e.message)}</p>`)}
}
async function confirmRenew(kind,serviceId,productId,product){
  openSheet(`<h3>روش پرداخت تمدید</h3><div class="card pad" style="margin:14px 0"><b>${esc(product.name)}</b><div class="muted">${fa(product.days)} روز · ${product.gb?fa(product.gb)+" گیگ":"نامحدود"}</div><h2 class="num" style="margin-top:8px">${fa(product.price)} تومان</h2></div><button class="btn pri block" id="renewwallet">پرداخت از کیف پول (${fa(S.data.user.wallet)} تومان)</button><button class="btn block" id="renewcard" style="margin-top:9px">پرداخت کارت‌به‌کارت</button>`);
  const pay=async method=>{const b=method==="wallet"?$("#renewwallet"):$("#renewcard");b.disabled=true;b.textContent="در حال ثبت سفارش…";try{const r=await api("/renew",{method:"POST",body:JSON.stringify({kind,service_id:Number(serviceId),product_id:productId,method,gb:product.gb,days:product.days})});if(method==="card")return receiptPicker(r.order_id,r.amount,r.card_number,r.card_holder);S.data.user.wallet=r.wallet;S.wallet=null;const fresh=await api("/bootstrap");S.data={...S.data,...fresh};openSheet(`<div style="text-align:center;padding:22px 4px"><div class="big" style="color:var(--ok)">✓</div><h2>تمدید با موفقیت انجام شد</h2><p class="muted">اشتراک شما تمدید شد.</p><button class="btn pri block" id="renewdone">بازگشت به سرویس‌ها</button></div>`);$("#renewdone")?.addEventListener("click",()=>{closeSheet();setTab("services")})}catch(e){b.disabled=false;b.textContent="تلاش دوباره";toast(e.message||"تمدید ناموفق بود")}};
  $("#renewwallet")?.addEventListener("click",()=>pay("wallet"));$("#renewcard")?.addEventListener("click",()=>pay("card"));
}

async function checkoutProduct(el){
  const id=Number(el.dataset.id),product=S.plans?.items?.find(x=>x.id===id);
  if(!product)return toast("محصول پیدا نشد");
  const card=el.closest("[data-cid]"),gb=product.custom?Number($('[data-r="gb"]',card)?.value):null,days=product.custom?Number($('[data-r="days"]',card)?.value):null;
  const amount=product.custom?Math.round(gb*product.custom.price_per_gb+days*product.custom.price_per_day):Number(product.price);
  let couponCode="", finalAmount=amount;
  openSheet(`<div class="sheethead"><h3>تأیید سفارش</h3><p>${esc(product.name)}</p></div>
    <div class="card pad" style="margin:14px 0"><div class="fact"><small>حجم</small><b>${product.custom?fa(gb)+" گیگ":product.gb?fa(product.gb)+" گیگ":"نامحدود"}</b></div><div class="fact"><small>مدت</small><b>${fa(product.custom?days:product.days)} روز</b></div><div class="fact"><small>قیمت محصول</small><b class="num">${fa(amount)} تومان</b></div><div class="fact" id="discountrow" style="display:none"><small>تخفیف</small><b class="num" id="discountvalue">۰ تومان</b></div><div class="fact"><small>مبلغ نهایی</small><b class="num" id="finalamount">${fa(amount)} تومان</b></div><div class="fact"><small>موجودی کیف پول</small><b class="num">${fa(S.data.user.wallet)} تومان</b></div></div>
    <div style="display:flex;gap:8px;margin:12px 0"><input id="couponinput" placeholder="کد تخفیف" autocomplete="off" style="min-width:0;flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit"><button class="btn" id="applycoupon">اعمال کد</button></div><div id="couponmsg" class="muted" style="font-size:12px;min-height:20px"></div>
    <div class="note">کد تخفیف قبل از ثبت سفارش اعتبارسنجی می‌شود. پس از پرداخت، سرویس به‌صورت خودکار ساخته می‌شود.</div>
    <button class="btn pri block" id="confirmbuy" style="margin-top:16px" ${S.data.user.wallet<amount?"disabled":""}>${ic("lock")}پرداخت از کیف پول</button><button class="btn block" id="confirmbuycard" style="margin-top:9px">پرداخت کارت‌به‌کارت</button>
    ${S.data.user.wallet<amount?'<p class="muted" style="text-align:center;margin-top:10px">موجودی کافی نیست؛ می‌تونی کارت‌به‌کارت پرداخت کنی.</p>':""}`);
  const btn=$("#confirmbuy");if(!btn)return;
  const syncPay=()=>{const enough=S.data.user.wallet>=finalAmount;btn.disabled=!enough;btn.innerHTML=enough?ic("lock")+"پرداخت از کیف پول": "موجودی کیف پول کافی نیست";$("#finalamount").textContent=fa(finalAmount)+" تومان"};
  $("#applycoupon")?.addEventListener("click",async()=>{const b=$("#applycoupon"),code=$("#couponinput").value.trim();if(!code){couponCode="";finalAmount=amount;$("#discountrow").style.display="none";$("#couponmsg").textContent="کد تخفیف حذف شد.";syncPay();return}b.disabled=true;b.textContent="بررسی…";try{const r=await api("/coupon-check",{method:"POST",body:JSON.stringify({code,product_id:id,gb,days})});couponCode=r.code;finalAmount=r.amount;$("#discountrow").style.display=r.discount?"flex":"none";$("#discountvalue").textContent=fa(r.discount)+" تومان";$("#couponmsg").textContent=r.discount?"کد تخفیف با موفقیت اعمال شد.":"این کد تخفیفی روی این سفارش ایجاد نمی‌کند.";syncPay()}catch(e){couponCode="";finalAmount=amount;$("#discountrow").style.display="none";$("#couponmsg").textContent=e.message;syncPay()}finally{b.disabled=false;b.textContent="اعمال کد"}});
  $("#couponinput")?.addEventListener("input",()=>{if(couponCode){couponCode="";finalAmount=amount;$("#discountrow").style.display="none";syncPay()}});
  btn.onclick=async()=>{
    btn.disabled=true;btn.textContent="در حال ثبت سفارش…";
    try{
      const r=await api("/purchase",{method:"POST",body:JSON.stringify({product_id:id,gb,days,coupon_code:couponCode})});
      const sv=await api(`/service?kind=o&id=${r.order_id}`);
      S.data.user.wallet=r.wallet;
      S.wallet=null;
      S.usage[`o:${r.order_id}`]=sv;
      const link=sv.link||"";
      openSheet(`<div style="text-align:center;padding:18px 4px"><div class="big" style="color:var(--ok)">✓</div><h2>خرید با موفقیت انجام شد</h2><p class="muted">سرویس شما آماده است و از بخش «سرویس‌ها» هم قابل مشاهده است.</p></div>
        <div class="card pad" style="margin:12px 0"><b>${esc(sv.title||product.name)}</b><p class="muted" style="margin-top:6px">${esc(link||"لینک سرویس در جزئیات سرویس قابل مشاهده است.")}</p></div>
        ${link?`<button class="btn pri block" id="copynewlink">کپی لینک اتصال</button>`:""}
        <button class="btn block" id="gotoservices" style="margin-top:8px">مشاهده سرویس‌ها</button>`);
      $("#copynewlink")?.addEventListener("click",()=>copy(link,"لینک اتصال کپی شد"));
      $("#gotoservices")?.addEventListener("click",()=>{closeSheet();setTab("services")});
      const fresh=await api("/bootstrap");S.data={...S.data,...fresh};S.ready=true;
    }catch(e){btn.disabled=false;btn.textContent="تلاش دوباره";toast(e.message||"خرید انجام نشد")}
  };
  $("#confirmbuycard")?.addEventListener("click",async()=>{const b=$("#confirmbuycard");b.disabled=true;try{const r=await api("/purchase-card",{method:"POST",body:JSON.stringify({product_id:id,gb,days,coupon_code:couponCode})});receiptPicker(r.order_id,r.amount,r.card_number,r.card_holder)}catch(e){b.disabled=false;toast(e.message)}});
}
const ACT={
  tab:el=>setTab(el.dataset.t),
  svc:el=>openService(el.dataset.k),
  qa:el=>{const q=el.dataset.q;if(q==="shop")setTab("shop");else if(q==="svcs")setTab("services");else{setTab("more").then(()=>{const t=q==="ref"?$("#refcard"):$("#helpsec");t&&t.scrollIntoView({behavior:"smooth",block:"center"})})}},
  topup:el=>openTopup(Number(el?.dataset?.amount)||0),
  tickets:()=>openTickets(),
  buy:el=>checkoutProduct(el),
  renew:el=>openRenew(el.dataset.k),
  xfer:el=>openTransfer(el.dataset.k),
  howto:()=>{closeSheet();setTab("more").then(()=>setTimeout(()=>{const h=$("#helpsec");h&&h.scrollIntoView({behavior:"smooth"})},300))},
  cat:el=>{hap();S.cat=+el.dataset.id;render()},
  wf:el=>{hap();S.wf=el.dataset.f;render()},
  reload:async()=>{hap();S.usage={};render();loadUsage()},
  copyref:()=>copy(S.data.refLink,"لینک دعوت کپی شد"),
  shareref:()=>{const u="https://t.me/share/url?url="+encodeURIComponent(S.data.refLink)+"&text="+encodeURIComponent("با این لینک عضو ربات بشو 🚀");if(DEMO)return toast("در حالت نمایشی انجام نمیشه");openTg(u)},
  copyid:()=>copy(String(S.data.user.id),"شناسه کپی شد"),
  openbot:()=>{if(DEMO)return toast("در حالت نمایشی انجام نمیشه");try{tg&&tg.close&&tg.close()}catch{}},
  copylink:()=>copy($("#sheet").dataset.link,"لینک اشتراک کپی شد"),
  qr:el=>showQR(el.dataset.k),
  closesheet:closeSheet,
};
document.addEventListener("click",e=>{
  if(e.target.id==="scrim"){closeSheet();return}
  const a=e.target.closest("a[data-ext]");if(a){e.preventDefault();openTg(a.getAttribute("href"));return}
  const el=e.target.closest("[data-act]");if(el&&ACT[el.dataset.act]){e.preventDefault();ACT[el.dataset.act](el)}
});
window.addEventListener("resize",moveInd);

/* ============ بارگذاری ============ */
async function loadUsage(){
  const list=S.data.services.filter(s=>s.live&&!S.usage[key(s)]);let i=0;
  const worker=async()=>{while(i<list.length&&i<14){const sv=list[i++];try{S.usage[key(sv)]=await api(`/service?kind=${sv.kind}&id=${sv.id}`)}catch{S.usage[key(sv)]={usage:null,usageErr:true}}repaintSvc(key(sv))}};
  await Promise.all([worker(),worker(),worker()]);
}
function fullState(icn,title,text,btn=""){$("#tabs").hidden=true;app().innerHTML=`<div class="fs view"><div class="big">${ic(icn)}</div><h1>${title}</h1><p>${text}</p>${btn}</div>`}
async function boot(){
  applyTheme();
  app().innerHTML=`<div class="top"><div class="skl" style="width:44px;height:44px;border-radius:15px"></div><div class="skl" style="flex:1;height:36px"></div></div><div class="skl" style="height:150px;border-radius:22px;margin-bottom:14px"></div><div class="skl" style="height:90px;border-radius:22px;margin-bottom:14px"></div><div class="skl" style="height:170px;border-radius:22px"></div>`;
  await waitTelegram();
  if(tg){try{tg.ready();tg.expand();tg.onEvent&&tg.onEvent("themeChanged",()=>{applyTheme();moveInd()})}catch{}applyTheme()}
  if(!DEMO&&!initData())return fullState("bot","فقط داخل تلگرام","این مینی‌اپ رو از داخل ربات (دکمه‌ی «📱 مینی‌اپ») باز کن.");
  let b;
  try{b=await api("/bootstrap")}
  catch(e){
    if(e.status===403&&e.body&&e.body.disabled)return fullState("tool","مینی‌اپ فعلا غیرفعاله","مدیر ربات این بخش رو موقتا بسته. از داخل ربات ادامه بده.");
    if(e.status===403&&e.body&&e.body.banned)return fullState("shield","دسترسی مسدوده","حساب شما اجازه‌ی استفاده از ربات رو نداره.");
    if(e.status===401)return fullState("shield","نشست منقضی شده","مینی‌اپ رو ببند و دوباره از داخل ربات باز کن.");
    return fullState("tool","خطا در بارگذاری",esc(e.message||"دوباره امتحان کن"),`<button class="btn pri" onclick="location.reload()">${ic("refresh")}تلاش دوباره</button>`);
  }
  if(b.app)setAccent(b.app.accent);
  if(b.maintenance&&b.maintenance.on)return fullState("tool","ربات موقتا خاموشه",esc(b.maintenance.text||"در حال به‌روزرسانی هستیم؛ کمی بعد برگرد."));
  if(b.registered===false)return fullState("bot","اول ربات رو استارت کن","برای استفاده از مینی‌اپ باید حداقل یک‌بار ربات رو استارت کرده باشی.",b.bot&&b.bot.username?`<button class="btn pri" onclick="window.Telegram&&Telegram.WebApp?Telegram.WebApp.openTelegramLink('https://t.me/${esc(b.bot.username)}?start=1'):window.open('https://t.me/${esc(b.bot.username)}')">${ic("send")}باز کردن ربات</button>`:"");
  S.data=b;S.ready=true;render();loadUsage();
  if(b.user&&b.user.admin&&b.maintenance&&b.maintenance.text===undefined){}
}
// پیش‌نمایش زنده داخل پنل مدیریت (فقط حالت نمایشی)
window.addEventListener("message",e=>{if(!DEMO||e.origin!==location.origin||!e.data||!e.data.vpPreview||!S.data)return;const p=e.data.vpPreview;if(p.accent)setAccent(p.accent);if(p.title!==undefined)S.data.app.title=p.title||"مینی‌اپ";if(p.banner!==undefined)S.data.app.banner=p.banner;if(p.sections)S.data.app.sections={...S.data.app.sections,...p.sections};if(p.tab&&VIEWS[p.tab]){if(p.tab==="shop"&&!S.plans)api("/plans").then(x=>{S.plans=x;S.tab="shop";render()});else if(p.tab==="wallet"&&!S.wallet)api("/wallet").then(x=>{S.wallet=x;S.tab="wallet";render()});else{S.tab=p.tab;render()}}else render()});
boot();
</script>
