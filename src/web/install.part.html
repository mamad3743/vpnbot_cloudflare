<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>نصب ربات</title>
<link rel="icon" href="/panel/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<style>
:root{
  --bg:#090a10;--grid:rgba(255,255,255,.035);--card:rgba(18,19,28,.72);--bd:rgba(255,255,255,.08);--bd-hi:rgba(99,102,241,.35);
  --p:#6366f1;--p2:#8b5cf6;--glow:rgba(99,102,241,.35);--tx:#f8fafc;--mut:#94a3b8;--badge:rgba(99,102,241,.15);--spec:rgba(255,255,255,.12);
  --field:rgba(255,255,255,.04);--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--font:Vazirmatn,"Segoe UI",Tahoma,sans-serif;
}
[data-theme="terminal-amber"]{--bg:#0c0a08;--grid:rgba(245,158,11,.04);--card:rgba(24,20,16,.78);--bd:rgba(245,158,11,.16);--bd-hi:rgba(245,158,11,.45);--p:#f59e0b;--p2:#ea580c;--glow:rgba(245,158,11,.35);--tx:#fffbeb;--mut:#d6a35c;--badge:rgba(245,158,11,.15);--spec:rgba(245,158,11,.25)}
[data-theme="cyber-emerald"]{--bg:#060e0a;--grid:rgba(16,185,129,.045);--card:rgba(10,24,18,.78);--bd:rgba(16,185,129,.16);--bd-hi:rgba(16,185,129,.4);--p:#10b981;--p2:#06b6d4;--glow:rgba(16,185,129,.35);--tx:#ecfdf5;--mut:#6ee7b7;--badge:rgba(16,185,129,.15);--spec:rgba(16,185,129,.25)}
[data-theme="light-clean"]{--bg:#f8fafc;--grid:rgba(15,23,42,.045);--card:rgba(255,255,255,.88);--bd:#e2e8f0;--bd-hi:rgba(99,102,241,.25);--p:#4f46e5;--p2:#7c3aed;--glow:rgba(79,70,229,.2);--tx:#0f172a;--mut:#64748b;--badge:rgba(79,70,229,.08);--spec:rgba(255,255,255,.8);--field:rgba(15,23,42,.04);--ok:#059669;--bad:#dc2626;--warn:#b45309}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:400 14px/1.85 var(--font);min-height:100vh;transition:background .35s,color .35s;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--p);color:#fff}
button,input{font:inherit;color:inherit}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
/* پس‌زمینه */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .grid{position:absolute;inset:0;background-size:32px 32px;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);-webkit-mask-image:radial-gradient(circle at 50% 30%,#000 40%,transparent 85%);mask-image:radial-gradient(circle at 50% 30%,#000 40%,transparent 85%)}
.bg i{position:absolute;border-radius:50%;filter:blur(120px);opacity:.28;transition:background .35s}
.bg i:nth-child(2){width:520px;height:520px;background:var(--p);top:-180px;right:-120px}
.bg i:nth-child(3){width:420px;height:420px;background:var(--p2);bottom:-160px;left:-100px;opacity:.2}
/* سربرگ */
.hd{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 78%,transparent)}
.hd-in{max-width:980px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 8px 24px -6px var(--glow)}
.hd b{display:block;font-size:15px;font-weight:800;line-height:1.3;letter-spacing:.01em}.hd small{color:var(--mut);font-size:11.5px}
.sp{flex:1}
.themes{display:flex;gap:8px;align-items:center;padding:5px 9px;border:1px solid var(--bd);border-radius:99px;background:var(--field)}
.themes button{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:.15s}
.themes button.on{border-color:var(--tx);transform:scale(1.15)}
/* قالب */
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:28px 18px 60px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.st{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:right;padding:10px 14px;border-radius:14px;border:1px solid rgba(128,128,160,.14);background:var(--field);cursor:pointer;transition:.2s}
.st:disabled{cursor:default;opacity:.55}
.st:not(:disabled):hover{border-color:var(--bd-hi)}
.st small{display:block;font-size:11px;color:var(--mut);line-height:1.5}.st span{font-weight:700;font-size:13px}
.st .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:rgba(128,128,160,.18);flex:none;transition:.2s}
.st.on{border-color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent);box-shadow:0 4px 20px -2px var(--glow)}
.st.on small{color:var(--p)}.st.on .n{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 0 14px var(--glow)}
.st.done{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.07)}.st.done small{color:var(--ok)}.st.done .n{background:rgba(16,185,129,.2);color:var(--ok)}
.glass{background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;box-shadow:0 20px 40px -15px rgba(0,0,0,.5),inset 0 1px 0 0 var(--spec)}
.panel{padding:30px;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.tags{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 10px;border-radius:99px;background:var(--badge);color:var(--p);font-family:ui-monospace,Menlo,monospace;direction:ltr}
.tags .t2{font-size:12px;color:var(--mut);letter-spacing:0;font-family:var(--font);font-weight:500;background:none;padding:0}
h1{font-size:23px;font-weight:800;line-height:1.5;letter-spacing:-.01em}
.lead{color:var(--mut);margin:4px 0 22px;max-width:60ch}
.lbl{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}.lbl .ic{color:var(--p)}.lbl em{margin-right:auto;font-style:normal;font-weight:400;font-size:12px;color:var(--mut)}
.row{display:flex;align-items:stretch;border:1px solid var(--bd);border-radius:14px;background:var(--field);overflow:hidden;transition:.15s}
.row:focus-within{border-color:var(--p);box-shadow:0 0 0 3px var(--glow)}
.row .pre{display:grid;place-items:center;padding:0 14px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mut);border-left:1px solid var(--bd);background:rgba(128,128,160,.07);font-family:ui-monospace,monospace;direction:ltr}
.row input{flex:1;min-width:0;background:none;border:0;outline:0;padding:12px 14px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px}
.row input::placeholder{color:var(--mut);opacity:.6}
.row .act{border:0;border-right:1px solid var(--bd);background:rgba(128,128,160,.07);padding:0 16px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap;transition:.15s}
.row .act:hover{background:var(--badge);color:var(--p)}.row .act:disabled{opacity:.5;cursor:default}
.field{margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:14px;border:1px solid var(--bd);background:var(--field);padding:11px 20px;cursor:pointer;font-weight:600;transition:.15s;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:var(--bd-hi)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.btn.go{border:0;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 10px 30px -8px var(--glow)}
.btn.go:hover{filter:brightness(1.1)}
.btn.block{width:100%}
.btn.ghost{background:none;border-color:transparent;color:var(--mut);padding:8px 12px;font-weight:500}.btn.ghost:hover{color:var(--tx)}
.nav{display:flex;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}.nav .sp{flex:1}.nav .cnt{color:var(--mut);font-size:12px}
.pill{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;background:var(--badge);color:var(--tx);font-size:13px;margin-top:6px}.pill .ic{color:var(--p);margin-top:3px}
.pill.warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3)}.pill.warn .ic{color:var(--warn)}
code,.code{font-family:ui-monospace,Menlo,monospace;background:rgba(128,128,160,.16);padding:1px 7px;border-radius:6px;font-size:12.5px;direction:ltr;unicode-bidi:isolate}
.card2{border:1px solid rgba(16,185,129,.35);background:rgba(16,185,129,.07);border-radius:14px;padding:14px 16px;margin:14px 0}
.card2 .h{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:700;font-size:13px;margin-bottom:8px}.card2 .h em{margin-right:auto;font-style:normal;font-size:11px;padding:1px 9px;border-radius:99px;background:rgba(16,185,129,.18)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}.kv dt{color:var(--mut)}.kv dd{margin:0;text-align:left;direction:ltr;font-family:ui-monospace,monospace;word-break:break-all}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:2px 12px;border-radius:99px;background:var(--badge);font-size:12.5px;font-family:ui-monospace,monospace;direction:ltr}.chip.auto{background:rgba(16,185,129,.16);color:var(--ok)}
.wait{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:12px 0 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 4px}
.sum{text-align:right;border:1px solid var(--bd);background:var(--field);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s}
.sum:hover{border-color:var(--bd-hi)}.sum small{color:var(--mut);display:flex;align-items:center;justify-content:space-between;font-size:11.5px}.sum b{display:block;font-size:13.5px;margin-top:2px;direction:ltr;text-align:right;word-break:break-all;font-family:ui-monospace,monospace}
.meter{height:6px;border-radius:6px;background:rgba(128,128,160,.2);margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;width:0;border-radius:6px;transition:.25s}
.alert{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;margin-top:16px;border:1px solid}
.alert.ok{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08);color:var(--ok)}.alert.er{border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.08);color:var(--bad)}.alert.wa{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08);color:var(--warn)}
.alert b{display:block;color:var(--tx)}.alert small{color:var(--mut);word-break:break-word}
.ok-big{width:68px;height:68px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:rgba(16,185,129,.16);color:var(--ok);box-shadow:0 0 34px rgba(16,185,129,.35)}.ok-big .ic{width:34px;height:34px}
.checks .r{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.checks .r:last-child{border:0}.checks .r .ic{color:var(--ok)}.checks .r.bad .ic{color:var(--warn)}
.foot{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--mut);font-size:12px;margin-top:16px}
.spin{width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.steps{padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:6px 0 4px}.steps li{counter-increment:s;display:flex;gap:12px}.steps li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--badge);color:var(--p);display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:2px}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(14px);border-radius:12px;padding:9px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:fade .2s}.toast.er{border-color:rgba(248,113,113,.5)}.toast.ok .ic{color:var(--ok)}.toast.er .ic{color:var(--bad)}
@media (max-width:760px){.stepper{grid-template-columns:repeat(4,auto);justify-content:center}.st{padding:8px}.st>div{display:none}.st.on>div{display:block}.sums{grid-template-columns:1fr}.panel{padding:22px 18px}h1{font-size:20px}.row .act span{display:none}.hd small{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-bot" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>

</defs></svg>
<header class="hd"><div class="hd-in">
  <div class="logo"><svg class="ic"><use href="#i-bot"/></svg></div>
  <div><b>نصب ربات</b><small id="rt"></small></div><div class="sp"></div>
  <div class="themes" role="group" aria-label="تم رنگی" id="themes"></div>
</div></header>
<main><div id="app"></div><div class="foot" id="foot"></div></main>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fa=n=>Number(n||0).toLocaleString("fa-IR");
const nd=s=>String(s??"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
function toast(m,t="ok"){const e=document.createElement("div");e.className="toast "+t;e.innerHTML=ic(t==="ok"?"check":"alert")+"<span>"+esc(m)+"</span>";$("#toasts").append(e);setTimeout(()=>e.remove(),t==="ok"?2600:5500)}
async function api(path,body){
  const r=await fetch(path,{method:body===undefined?"GET":"POST",headers:{"content-type":"application/json","x-panel":"1"},body:body===undefined?undefined:JSON.stringify(body),credentials:"same-origin"});
  const j=await r.json().catch(()=>({ok:false,error:"پاسخ نامعتبر از سرور"}));
  if(j.ok===false)throw new Error(j.error||"خطا");return j;
}
async function busy(b,fn){b.disabled=true;const h=b.innerHTML;b.innerHTML='<span class="spin"></span>';try{return await fn()}catch(e){toast(e.message,"er")}finally{b.disabled=false;b.innerHTML=h}}

/* ---- تم‌ها (فقط ظاهر؛ انتخاب توی مرورگر ذخیره میشه) ---- */
const THEMES=[["default","دارک شیشه‌ای","#6366f1"],["terminal-amber","ترمینال نارنجی","#f59e0b"],["cyber-emerald","سایبر نئون","#10b981"],["light-clean","روشن و مینیمال","#e2e8f0"]];
function setTheme(k){document.documentElement.dataset.theme=k;try{localStorage.setItem("vp_theme",k)}catch{}$$themes()}
function $$themes(){$("#themes").innerHTML=THEMES.map(([k,n,c])=>`<button type="button" class="${document.documentElement.dataset.theme===k?"on":""}" style="background:${c}" title="${n}" aria-label="${n}" data-k="${k}"></button>`).join("");$("#themes").querySelectorAll("button").forEach(b=>b.onclick=()=>setTheme(b.dataset.k))}
try{const t=localStorage.getItem("vp_theme");if(THEMES.some(x=>x[0]===t))document.documentElement.dataset.theme=t}catch{}
$$themes();

/* ---- وضعیت ویزارد ---- */
const STEPS=[["گام ۱","توکن ربات","bot"],["گام ۲","شناسه مدیر","user"],["گام ۳","رمز پنل","lock"],["گام ۴","ثبت وب‌هوک","zap"]];
const W={step:1,max:1,st:null,bot:null,botOk:false,claim:null,claimed:null,canClaim:false,hook:"",adminsText:"",password:"",poll:null,alert:null};

function shell(inner,{stepper=true}={}){
  const rt=W.st?(W.st.runtime==="railway"?"اجرا روی Railway":"اجرا روی Cloudflare Workers"):"";
  $("#rt").textContent=rt;
  $("#app").innerHTML=(stepper?`<div class="stepper">${STEPS.map(([g,t,i],k)=>{const n=k+1,cls=n===W.step?"on":n<W.step?"done":"";return `<button type="button" class="st ${cls}" data-s="${n}" ${n>W.max?"disabled":""}><div><small>${g}${n<W.step?" · تکمیل":n===W.step?" · فعال":""}</small><span>${t}</span></div><div class="n">${n<W.step?ic("check"):fa(n)}</div></button>`}).join("")}</div>`:"")+`<div class="glass panel">${inner}</div>`;
  $("#app").querySelectorAll(".st").forEach(b=>b.onclick=()=>{if(+b.dataset.s<=W.max){stopPoll();W.step=+b.dataset.s;render()}});
  $("#foot").innerHTML=`${ic("lock")}<span>توکن و رمز فقط داخل دیتابیس همین سرویس ذخیره میشن و توی بکاپ‌ها نمیان.</span>`;
}
const head=(t1,t2,title,lead)=>`<div class="tags"><span class="tag">${t1}</span><span class="tag t2">${t2}</span></div><h1>${title}</h1><p class="lead">${lead}</p>`;
const navRow=(prev,nextHtml,cnt)=>`<div class="nav">${nextHtml}${prev?`<button type="button" class="btn ghost" id="pv">${ic("right")}مرحله قبل</button>`:""}<span class="sp"></span><span class="cnt">${cnt}</span></div>`;

/* ---- قفل کد نصب ---- */
function viewGate(){
  const s=W.st;
  if(s.codeMissing){
    shell(`${head("INSTALL CODE •","قفل امنیتی","کد نصب تنظیم نشده","برای این‌که هیچ‌کس غیر از تو نتونه ربات رو روی این آدرس نصب کنه، اول یک «کد نصب» (حداقل ۶ کاراکتر) تعریف کن.")}
    ${s.runtime==="railway"?`<ol class="steps"><li>در Railway: سرویس ← Variables ← متغیر <code>INSTALL_CODE</code> رو با یک کد دلخواه بساز.</li><li>سرویس خودش دوباره بالا میاد؛ بعدش همین صفحه رو رفرش کن.</li></ol>`:`<ol class="steps"><li>در فایل <code>wrangler.toml</code> بخش <code>[vars]</code> مقدار <code>INSTALL_CODE</code> رو یک کد دلخواه بذار (یا در داشبورد کلادفلر: Worker ← Settings ← Variables).</li><li>دوباره <code>wrangler deploy</code> بزن و همین صفحه رو رفرش کن.</li></ol>`}
    <div class="nav"><button class="btn go" id="rl">${ic("refresh")}بررسی دوباره</button></div>`,{stepper:false});
    $("#rl").onclick=()=>location.reload();return;
  }
  shell(`${head("INSTALL CODE •","قفل امنیتی","کد نصب رو وارد کن",s.codeInLog?"کد نصب موقع بالا اومدن سرور توی <b>لاگ‌های Railway</b> چاپ شده: Deployments ← View logs ← دنبال «INSTALL CODE» بگرد. (اگه می‌خوای ثابت باشه، متغیر <code>INSTALL_CODE</code> رو خودت ست کن.)":"همون مقداری که برای <code>INSTALL_CODE</code> ست کردی.")}
  <div class="field"><div class="lbl">${ic("key")}<span>کد نصب</span></div><div class="row"><span class="pre">CODE</span><input type="password" id="code" autocomplete="off" autofocus><button class="act" id="ok">${ic("check")}<span>تایید</span></button></div></div>
  <div class="pill">${ic("info")}<span>این قفل جلوی نصب ربات دیگران روی دامنه‌ی تو رو می‌گیره.</span></div>`,{stepper:false});
  const go=()=>busy($("#ok"),async()=>{await api("/install/api/unlock",{code:$("#code").value});await load()});
  $("#ok").onclick=go;$("#code").onkeydown=e=>{if(e.key==="Enter")go()};
}

/* ---- گام ۱: توکن ---- */
function viewToken(){
  shell(`${head("TELEGRAM BOT API •","گام نخست","احراز هویت و توکن ربات تلگرام","کلید API ربات رو از <b>@BotFather</b> بگیر و اینجا بذار.")}
  <div class="field"><div class="lbl">${ic("key")}<span>توکن ربات (Bot API Token)</span><em>فرمت: <code>123456:ABC-DEF...</code></em></div>
    <div class="row"><span class="pre">TOKEN</span><input type="password" id="tok" placeholder="7192834012:AAH9f..." autocomplete="off" spellcheck="false"><button class="act" id="chk">${ic("refresh")}<span>بررسی با getMe</span></button></div></div>
  <div id="info">${W.botOk?botCard():""}</div>
  <div class="pill">${ic("info")}<span>برای توکن جدید به <b>@BotFather</b> برو و <code>/newbot</code> بزن (یا <code>/mybots</code> ← ربات ← API Token).</span></div>
  <div class="pill warn">${ic("alert")}<span>اگه همین ربات الان جای دیگه‌ای (Cloudflare یا سرور قبلی) فعاله، از همین لحظه آپدیت‌هاش به اینجا میان.</span></div>
  ${navRow(false,`<button class="btn go" id="nx" ${W.botOk?"":"disabled"}><span>گام بعدی: شناسه مدیر</span>${ic("left")}</button>`,"گام ۱ از ۴")}`);
  const check=()=>busy($("#chk"),async()=>{const r=await api("/install/api/token",{token:nd($("#tok").value.trim())});applyToken(r);toast("ربات پیدا شد: @"+r.bot.username);$("#info").innerHTML=botCard();$("#nx").disabled=false;$("#tok").value=""});
  $("#chk").onclick=check;$("#tok").onkeydown=e=>{if(e.key==="Enter")check()};$("#nx").onclick=()=>go(2);
}
function applyToken(r){W.bot=r.bot;W.botOk=true;W.claim=r.claim_code;W.canClaim=r.canClaim;W.claimed=r.claimed;W.hook=r.webhook_url||"";W.max=Math.max(W.max,2)}
const botCard=()=>`<div class="card2"><div class="h">${ic("circle-check")}<span>نتیجه‌ی استعلام از تلگرام</span><em>تایید شده</em></div><dl class="kv"><dt>نام نمایشی</dt><dd style="font-family:var(--font);direction:rtl">${esc(W.bot.name)}</dd><dt>یوزرنیم</dt><dd>@${esc(W.bot.username)}</dd></dl></div>`;

/* ---- گام ۲: مدیر ---- */
function adminIds(){const ids=nd(W.adminsText).split(/[,\s،]+/).map(s=>s.trim()).filter(Boolean);if(W.claimed)ids.unshift(String(W.claimed.id));return [...new Set(ids)]}
function chipsHtml(){const ids=adminIds();return ids.length?ids.map(i=>`<span class="chip ${W.claimed&&String(W.claimed.id)===i?"auto":""}">${W.claimed&&String(W.claimed.id)===i?ic("check"):""}${esc(i)}</span>`).join(""):'<span class="lead" style="margin:0;font-size:12.5px">هنوز ادمینی انتخاب نشده</span>'}
function claimHtml(){return W.claimed?`<div class="card2"><div class="h">${ic("circle-check")}<span>شناسایی شد: ${esc(W.claimed.name||"—")}</span><em>خودکار</em></div><div class="mono" style="font-size:13px">${W.claimed.id}</div></div>`
  :`<a class="btn go block" href="https://t.me/${esc(W.bot.username)}?start=${esc(W.claim)}" target="_blank" rel="noopener">${ic("send")}باز کردن ربات و تشخیص خودکار آیدی من</a><div class="wait"><span class="dot"></span>منتظر پیام تو توی ربات... (روی «Start» بزن)</div>`}
function viewAdmin(){
  shell(`${head("ACCESS CONTROL •","گام دوم","شناسه مدیر ارشد <span dir=\"ltr\">(Super Admin)</span>","دستورات حساس، پیام همگانی و پنل وب فقط به این شناسه‌های عددی جواب میدن.")}
  ${W.canClaim?`<div class="field"><div class="lbl">${ic("user")}<span>تشخیص خودکار</span><em>پیشنهادی</em></div><div id="cl">${claimHtml()}</div></div>`:`<div class="pill warn" style="margin:0 0 16px">${ic("alert")}<span>تشخیص خودکار فقط روی آدرس https کار می‌کنه؛ آیدی عددی رو دستی بنویس.</span></div>`}
  <div class="field"><div class="lbl">${ic("user")}<span>${W.canClaim?"یا آیدی عددی دستی":"آیدی عددی ادمین‌ها"}</span><em>چند تا → با کاما</em></div><div class="row"><span class="pre">UID</span><input id="adm" inputmode="numeric" placeholder="198302114, 987654321" value="${esc(W.adminsText)}" autocomplete="off"></div>
  <div class="chips" id="chips">${chipsHtml()}</div></div>
  <div class="pill">${ic("info")}<span>آیدی عددی خودت رو از <b>@userinfobot</b> هم می‌تونی بگیری. هر ادمین باید یک‌بار به ربات <code>/start</code> زده باشه تا ربات بتونه بهش پیام بده.</span></div>
  ${navRow(true,`<button class="btn go" id="nx"><span>گام بعدی: رمز پنل</span>${ic("left")}</button>`,"گام ۲ از ۴")}`);
  $("#adm").oninput=e=>{W.adminsText=e.target.value;$("#chips").innerHTML=chipsHtml()};
  $("#pv").onclick=()=>go(1);
  $("#nx").onclick=()=>{const ids=adminIds();if(!ids.length)return toast("حداقل یک ادمین لازمه","er");if(ids.some(a=>!/^\d{5,15}$/.test(a)))return toast("آیدی عددی فقط عدد باشه (۵ تا ۱۵ رقم)","er");W.max=Math.max(W.max,3);go(3)};
  if(W.canClaim&&!W.claimed)startPoll();
}
function startPoll(){stopPoll();W.poll=setInterval(async()=>{try{const r=await api("/install/api/claim");if(r.claimed){W.claimed=r.claimed;stopPoll();const c=$("#cl");if(c){c.innerHTML=claimHtml();$("#chips").innerHTML=chipsHtml()}toast("آیدی شناسایی شد ✅")}}catch{}},2000)}
function stopPoll(){if(W.poll){clearInterval(W.poll);W.poll=null}}

/* ---- گام ۳: رمز ---- */
const strength=p=>{let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return s};
const genPass=()=>{const c="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789-_!@#";return Array.from(crypto.getRandomValues(new Uint32Array(16)),x=>c[x%c.length]).join("")};
function viewPassword(){
  shell(`${head("PANEL ACCESS •","گام سوم","رمز پنل مدیریت وب","با این رمز از آدرس <code>/panel</code> وارد پنل میشی. از داخل ربات هم با دستور <code>/panel</code> لینک ورود یک‌بار مصرف می‌گیری.")}
  <div class="field"><div class="lbl">${ic("lock")}<span>رمز پنل</span><em>حداقل ۸ کاراکتر</em></div><div class="row"><span class="pre">PASS</span><input type="password" id="pw" autocomplete="new-password" value="${esc(W.password)}"><button class="act" id="shw" type="button" aria-label="نمایش رمز">${ic("eye")}</button><button class="act" id="gen" type="button">${ic("refresh")}<span>ساخت رمز قوی</span></button></div><div class="meter"><i id="pm"></i></div></div>
  <div class="field"><div class="lbl">${ic("lock")}<span>تکرار رمز</span></div><div class="row"><span class="pre">PASS</span><input type="password" id="pw2" autocomplete="new-password" value="${esc(W.password)}"></div></div>
  <div class="pill">${ic("info")}<span>دیتابیس لازم نیست انتخاب کنی: جدول‌ها روی ${W.st.runtime==="railway"?"SQLite داخل Volume":"Cloudflare D1"} خودکار ساخته شدن.</span></div>
  ${navRow(true,`<button class="btn go" id="nx"><span>گام بعدی: ثبت وب‌هوک</span>${ic("left")}</button>`,"گام ۳ از ۴")}`);
  const m=()=>{const s=strength($("#pw").value),e=$("#pm");e.style.width=(s/5*100)+"%";e.style.background=s<=2?"#ef4444":s<=3?"#fbbf24":"#10b981"};m();$("#pw").oninput=m;
  $("#shw").onclick=()=>{const t=$("#pw").type==="password"?"text":"password";$("#pw").type=$("#pw2").type=t};
  $("#gen").onclick=()=>{const p=genPass();$("#pw").value=$("#pw2").value=p;$("#pw").type=$("#pw2").type="text";m();navigator.clipboard?.writeText(p).then(()=>toast("رمز ساخته و کپی شد؛ جای امن ذخیره‌اش کن"),()=>toast("رمز ساخته شد؛ جای امن ذخیره‌اش کن"))};
  $("#pv").onclick=()=>{W.password=$("#pw").value;go(2)};
  $("#nx").onclick=()=>{const p=$("#pw").value;if(p.length<8)return toast("رمز باید حداقل ۸ کاراکتر باشه","er");if(p!==$("#pw2").value)return toast("تکرار رمز یکی نیست","er");W.password=p;W.max=Math.max(W.max,4);go(4)};
}

/* ---- گام ۴: وب‌هوک و نصب نهایی ---- */
function alertHtml(){const a=W.alert;if(!a)return"";return `<div class="alert ${a.t}">${ic(a.t==="ok"?"circle-check":"alert")}<div><b>${esc(a.title)}</b><small>${esc(a.msg||"")}</small></div></div>`}
function viewFinish(){
  const ids=adminIds();
  shell(`${head("TELEGRAM WEBHOOK •","گام چهارم (پایانی)","ثبت و فعال‌سازی وب‌هوک تلگرام","آدرس دریافت آپدیت‌ها روی همین سرویس ست میشه و ربات فعال میشه.")}
  ${W.hook?`<div class="field"><div class="lbl">${ic("link")}<span>آدرس وب‌هوک</span><em>آماده‌ی ثبت</em></div><div class="row"><span class="pre">POST</span><input id="hk" readonly value="${esc(W.hook)}"><button class="act" id="png" type="button">${ic("pulse")}<span>تست وب‌هوک</span></button><button class="act" id="cp" type="button">${ic("copy")}<span>کپی</span></button></div></div>`
  :`<div class="pill warn" style="margin:0 0 16px">${ic("alert")}<span>آدرس فعلی https نیست؛ وب‌هوک ست نمیشه و ربات با long polling کار می‌کنه (فقط روی Railway).</span></div>`}
  <div class="lbl" style="margin-top:6px">${ic("shield")}<span>خلاصه‌ی پیکربندی (برای ویرایش کلیک کن)</span></div>
  <div class="sums"><button class="sum" data-g="1" type="button"><small>ربات ${ic("pen")}</small><b>@${esc(W.bot.username)}</b></button><button class="sum" data-g="2" type="button"><small>ادمین‌ها ${ic("pen")}</small><b>${esc(ids.join(", "))}</b></button><button class="sum" data-g="3" type="button"><small>رمز پنل ${ic("pen")}</small><b>${"•".repeat(Math.min(W.password.length,12))}</b></button></div>
  ${alertHtml()}
  <div class="nav" style="margin-top:22px"><button class="btn go block" id="fin">${ic("zap")}<span>نصب و فعال‌سازی نهایی</span></button></div>
  <div class="nav" style="margin-top:6px"><button class="btn ghost" id="pv">${ic("right")}مرحله قبل</button><span class="sp"></span><button class="btn ghost" id="rst">${ic("undo")}شروع مجدد</button></div>`);
  $("#pv").onclick=()=>go(3);
  document.querySelectorAll(".sum").forEach(b=>b.onclick=()=>go(+b.dataset.g));
  $("#rst").onclick=()=>busy($("#rst"),async()=>{await api("/install/api/reset",{});Object.assign(W,{step:1,max:1,bot:null,botOk:false,claim:null,claimed:null,hook:"",adminsText:"",password:"",alert:null});toast("از اول شروع کردیم");render()});
  if($("#cp"))$("#cp").onclick=()=>navigator.clipboard?.writeText(W.hook).then(()=>toast("آدرس کپی شد"),()=>toast("کپی نشد","er"));
  if($("#png"))$("#png").onclick=()=>busy($("#png"),async()=>{const r=await api("/install/api/ping",{});W.alert=r.last_error?{t:"wa",title:"تلگرام آدرس رو شناخته ولی خطا داره",msg:r.last_error}:r.matches?{t:"ok",title:"وب‌هوک روی همین آدرس ثبت شده",msg:`آپدیت در صف: ${r.pending}`}:{t:"er",title:"وب‌هوک روی آدرس دیگه‌ای ثبت شده",msg:r.url||"ثبت نشده"};viewFinish()});
  $("#fin").onclick=()=>busy($("#fin"),async()=>{try{const r=await api("/install/api/finish",{admins:ids,password:W.password});await done(r)}catch(e){W.alert={t:"er",title:"نصب ناموفق بود",msg:e.message};viewFinish();throw e}});
}
async function done(r){
  stopPoll();
  shell(`<div style="text-align:center"><div class="ok-big">${ic("check")}</div><h1>نصب کامل شد 🎉</h1><p class="lead" style="margin:6px auto 18px">ربات آماده‌ست.</p></div>
  <div class="checks"><div class="r">${ic("circle-check")}<span>تنظیمات ذخیره شد</span></div>
  <div class="r ${r.webhook==="set"?"":"bad"}">${ic(r.webhook==="set"?"circle-check":"alert")}<span>${r.webhook==="set"?"وب‌هوک تلگرام روی همین آدرس ست شد":"وب‌هوک ست نشد (آدرس https نیست؛ ربات با long polling کار می‌کنه)"}</span></div>
  <div class="r ${r.notified?"":"bad"}">${ic(r.notified?"circle-check":"alert")}<span>${r.notified?`پیام تایید برای ${fa(r.notified)} ادمین رفت`:"پیام تایید نرفت — ادمین‌ها باید یک‌بار به ربات /start بزنن"}</span></div>
  <div class="r" id="lg">${ic("circle-check")}<span>در حال ورود به پنل...</span></div></div>
  <div class="nav" style="margin-top:22px"><a class="btn go block" href="/panel">${ic("left")}ورود به پنل</a></div>`,{stepper:false});
  let ok=false;for(let i=0;i<3&&!ok;i++){try{await api("/api/login",{password:W.password});ok=true}catch{await new Promise(r=>setTimeout(r,1200))}}
  const lg=$("#lg");if(lg){lg.className="r"+(ok?"":" bad");lg.innerHTML=ic(ok?"circle-check":"alert")+`<span>${ok?"وارد پنل شدی":"ورود خودکار نشد؛ با رمزی که ساختی از صفحه‌ی ورود وارد شو"}</span>`}
  W.password="";
}

function go(n){stopPoll();W.step=n;render()}
function render(){W.alert=W.step===4?W.alert:null;[null,viewToken,viewAdmin,viewPassword,viewFinish][W.step]()}
async function load(){
  const s=await api("/install/api/state");W.st=s;
  if(!s.unlocked){$("#foot").textContent="";return viewGate()}
  if(s.pending){applyToken({bot:s.pending.bot,claim_code:s.pending.claim_code,canClaim:s.https,claimed:s.pending.claimed,webhook_url:s.pending.webhook_url});if(W.step<2)W.step=2}
  else{W.step=1}
  render();
}
load().catch(e=>shell(`<h1>خطا</h1><div class="alert er">${ic("alert")}<div><b>${esc(e.message)}</b></div></div>`,{stepper:false}));
</script>
</body>
</html>
