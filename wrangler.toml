name = "config-sales-bot"
main = "src/index.js"
compatibility_date = "2024-11-01"

# بعد از اجرای دستور زیر، مقدار database_id رو از خروجی همون دستور اینجا جایگزین کن:
# wrangler d1 create config-sales-bot-db
[[d1_databases]]
binding = "DB"
database_name = "config-sales-bot-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# ---------- اختیاری: KV (کش مشترک تنظیمات؛ بدونش فقط کش حافظه استفاده میشه) ----------
# 1) wrangler kv namespace create CACHE   ← id رو از خروجی بردار
# 2) خط‌های زیر رو از حالت کامنت دربیار و id رو جایگزین کن، بعد دوباره wrangler deploy
# [[kv_namespaces]]
# binding = "KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# هر دقیقه: ادامه‌ی پیام همگانی (فقط اگه کاری در جریان باشه)
# بکاپ شبانه به تاپیک «💾 بکاپ» گروه گزارش: ۲۰:۳۰ UTC = ۰۰:۰۰ به وقت تهران
[triggers]
crons = ["* * * * *", "30 20 * * *"]

# ---------- اختیاری: آمار مصرف داخل پنل وب ----------
# فقط شناسه‌ها (محرمانه نیستن). توکن و Account ID رو با wrangler secret بذار:
#   wrangler secret put CF_API_TOKEN     (دسترسی Account Analytics: Read)
#   wrangler secret put CF_ACCOUNT_ID
[vars]
# کد قفل ویزارد نصب (/install): یک مقدار دلخواه و محرمانه (حداقل ۶ کاراکتر) بذار؛ «change-me» قبول نمیشه.
# بعد از نصب می‌تونی اینو خالی کنی.
INSTALL_CODE = "change-me"
CF_SCRIPT_NAME = "config-sales-bot"
D1_DATABASE_ID = ""      # همون database_id بالا
KV_NAMESPACE_ID = ""     # اگه KV ساختی، id اون
